# Block the setup wizard after the first installation.
# The installer can be temporarily enabled only by editing this staging configuration.
<Directory "/var/www/html/install">
    AllowOverride None
    Require all denied
</Directory>

# Application configuration is for PHP includes only, never direct web access.
<Directory "/var/www/html/config">
    AllowOverride None
    Require all denied
</Directory>
